<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attendance &amp; Payroll{% endblock %}</title>
  <style>
    :root {
      --ink:#182230; --muted:#667085; --line:#d9e2ec; --brand:#2563eb;
      --brand-dark:#1d4ed8; --green:#087f5b; --red:#c92a2a; --amber:#b7791f;
      --bg:#eef3f8; --panel:#ffffff; --soft:#f7fafc;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
    nav { background:#101828; padding:0 22px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; box-shadow:0 8px 24px rgba(16,24,40,.14); position:sticky; top:0; z-index:10; }
    nav .brand { color:#fff; font-weight:700; margin-right:14px; padding:15px 0; letter-spacing:.2px; }
    nav a { color:#d0d5dd; text-decoration:none; padding:15px 11px; font-size:14px; border-bottom:3px solid transparent; }
    nav a:hover { color:#fff; background:#1d2939; }
    nav a.active { color:#fff; border-color:#38bdf8; }
    main { max-width:1180px; margin:24px auto 36px; padding:0 16px; }
    h1 { font-size:24px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 18px; font-size:14px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; overflow-x:auto; box-shadow:0 12px 30px rgba(16,24,40,.06); }
    .metric-grid { display:grid; grid-template-columns:repeat(4, minmax(140px, 1fr)); gap:12px; margin-bottom:16px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
    .metric span { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .metric strong { display:block; margin-top:5px; font-size:26px; }
    .layout-grid { display:grid; grid-template-columns:1fr 330px; gap:16px; align-items:start; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); }
    th { background:var(--soft); font-weight:650; color:#344054; }
    tr[data-clickable] { cursor:pointer; }
    tr[data-clickable]:hover td { background:#f8fbff; }
    td.num, th.num { text-align:right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight:600; border-top:2px solid var(--line); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--brand); color:#fff; border:0; border-radius:6px; padding:8px 12px; min-height:34px; font-size:13px; font-weight:650; cursor:pointer; text-decoration:none; white-space:nowrap; }
    .btn:hover { background:var(--brand-dark); }
    .btn.gray { background:#667085; } .btn.red { background:var(--red); } .btn.green { background:var(--green); } .btn.amber { background:var(--amber); }
    .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .btn.ghost:hover { background:#f8fafc; }
    .badge { padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
    .badge.P { background:#d1fae5; color:#065f46; } .badge.A { background:#fee2e2; color:#991b1b; }
    .badge.L { background:#fef3c7; color:#92400e; } .badge.N { background:#e5e7eb; color:#374151; }
    .badge.Pending, .badge.PENDING { background:#fef3c7; color:#92400e; }
    .badge.Approved, .badge.APPROVED { background:#d1fae5; color:#065f46; }
    .badge.Rejected, .badge.REJECTED { background:#fee2e2; color:#991b1b; }
    form.inline { display:inline; }
    .filter { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    select, textarea, input[type=number], input[type=text], input[type=date] { padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px; background:#fff; color:var(--ink); }
    select:focus, textarea:focus, input:focus { outline:2px solid #bfdbfe; border-color:#60a5fa; }
    .messages { list-style:none; padding:0; margin:0 0 16px; }
    .messages li { padding:10px 14px; border-radius:6px; margin-bottom:6px; font-size:14px; background:#dbeafe; color:#1e40af; border:1px solid #bfdbfe; }
    .messages li.success { background:#d1fae5; color:#065f46; } .messages li.error { background:#fee2e2; color:#991b1b; }
    form p { margin:0 0 12px; } form label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
    form input, form textarea, form select { width:100%; max-width:420px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .tab { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:6px; padding:8px 12px; cursor:pointer; font-weight:650; }
    .tab.active { background:#101828; color:#fff; border-color:#101828; }
    .tab-panel[hidden] { display:none; }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    .status-strip { display:flex; gap:8px; flex-wrap:wrap; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:5px 9px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--muted); font-size:12px; }
    @media (max-width: 820px) {
      .metric-grid, .layout-grid { grid-template-columns:1fr; }
      nav { padding:0 12px; }
      nav .brand { width:100%; padding-bottom:4px; }
      nav a { padding:10px 8px; }
    }
    @media print { .no-print { display:none !important; } body { background:#fff; } }
  </style>
</head>
<body>
  <nav class="no-print">
    <span class="brand">Attendance &amp; Payroll</span>
    <a href="{% url 'dashboard' %}">Today</a>
    <a href="{% url 'mark_attendance' %}">Attendance</a>
    <a href="{% url 'leave_requests' %}">Leave</a>
    <a href="{% url 'report' %}">Payroll</a>
    <a href="{% url 'employee_list' %}">Employees</a>
    <a href="{% url 'admin:index' %}">Admin</a>
  </nav>
  <main>
    {% if messages %}
      <ul class="messages no-print">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('nav a').forEach(function(link) {
      if (link.pathname === window.location.pathname) link.classList.add('active');
    });
    document.querySelectorAll('[data-filter-target]').forEach(function(input) {
      input.addEventListener('input', function() {
        var target = document.querySelector(input.dataset.filterTarget);
        if (!target) return;
        var needle = input.value.toLowerCase();
        target.querySelectorAll('[data-filter-row]').forEach(function(row) {
          row.hidden = !row.textContent.toLowerCase().includes(needle);
        });
      });
    });
    document.querySelectorAll('[data-tab]').forEach(function(tab) {
      tab.addEventListener('click', function() {
        var group = tab.closest('[data-tabs]');
        group.querySelectorAll('[data-tab]').forEach(function(btn) { btn.classList.remove('active'); });
        group.querySelectorAll('.tab-panel').forEach(function(panel) { panel.hidden = true; });
        tab.classList.add('active');
        group.querySelector(tab.dataset.tab).hidden = false;
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
